name: Deploy

# Pushes to main trigger an SSH deploy onto the VPS at /home/brandstudio.
# The script pulls, updates Python + Node deps only when their lockfiles
# changed since the last successful deploy, rebuilds the Next.js app, then
# restarts both PM2 processes (app-brandstudio = Next.js, brandstudio = Flask).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          debug: true
          timeout: 120s
          command_timeout: 30m
          script_stop: false
          script: |
            set -euxo pipefail

            DEPLOY_DIR=/home/brandstudio
            VENV_DIR=/home/brandstudio-venv
            REPO_URL=https://github.com/carous-dev/Brand-Studio.git

            # If the directory exists but isn't a git checkout (manual upload,
            # earlier failed clone, etc.), initialise it in place and force-pull
            # so we don't trash whatever's already there.
            if [ ! -d "${DEPLOY_DIR}" ]; then
              git clone "${REPO_URL}" "${DEPLOY_DIR}"
            elif [ ! -d "${DEPLOY_DIR}/.git" ]; then
              cd "${DEPLOY_DIR}"
              git init
              git remote add origin "${REPO_URL}" 2>/dev/null || git remote set-url origin "${REPO_URL}"
              git fetch origin main
              git checkout -f -B main origin/main
            fi
            cd "${DEPLOY_DIR}"
            git remote set-url origin "${REPO_URL}"

            if [ -n "$(git status --porcelain)" ]; then
              git stash push -u -m "ci-cd-auto-stash-$(date +%s)"
            fi
            git fetch --prune
            git checkout main
            git pull --ff-only origin main

            # Track the previous deploy SHA so we can skip dep installs when
            # nothing relevant changed. Stored alongside the repo on the box.
            LAST_DEPLOY_FILE="${DEPLOY_DIR}/.last-deploy"
            last_deploy_ref=""
            if [ -f "${LAST_DEPLOY_FILE}" ]; then
              last_deploy_ref="$(tr -d '\n' < "${LAST_DEPLOY_FILE}")"
            fi

            python_changed=1
            node_changed=1
            if [ -n "${last_deploy_ref}" ] && git rev-parse --verify "${last_deploy_ref}" >/dev/null 2>&1; then
              if ! git diff --name-only "${last_deploy_ref}..HEAD" -- requirements.txt | grep -q .; then
                python_changed=0
              fi
              if ! git diff --name-only "${last_deploy_ref}..HEAD" -- package.json package-lock.json | grep -q .; then
                node_changed=0
              fi
            fi

            # Python venv lives OUTSIDE the project tree so the Next dev runtime
            # never has to walk through it (Turbopack panics on venv-internal
            # symlinks pointing at the system Python interpreter).
            if [ ! -d "${VENV_DIR}" ]; then
              python3 -m venv "${VENV_DIR}"
              python_changed=1
            fi
            # Defensive cleanup: nuke any in-project venv left over from manual
            # setup or a prior deploy version that put it here.
            if [ -e "${DEPLOY_DIR}/venv" ]; then
              rm -rf "${DEPLOY_DIR}/venv"
            fi
            # shellcheck disable=SC1091
            . "${VENV_DIR}/bin/activate"
            python -m pip install --upgrade pip
            if [ "${python_changed}" = "1" ]; then
              pip install -r requirements.txt
            else
              echo "Skipping pip install; requirements.txt unchanged since ${last_deploy_ref}"
            fi

            # Node deps (Next.js runtime — this app is served by `next dev`,
            # not a production build, so we install but don't build).
            if [ "${node_changed}" = "1" ]; then
              npm ci
            else
              echo "Skipping npm ci; package.json + lockfile unchanged since ${last_deploy_ref}"
            fi

            # Restart both PM2 processes. If a process doesn't exist yet (first
            # deploy of a name), `pm2 restart` errors — fall through to start.
            # The Flask process MUST point its interpreter at the external venv
            # since we no longer keep one inside the project tree.
            pm2 restart app-brandstudio || pm2 start ecosystem.config.cjs --only app-brandstudio || true
            pm2 restart brandstudio \
              || pm2 start ecosystem.config.cjs --only brandstudio \
              || pm2 start app.py --name brandstudio --interpreter "${VENV_DIR}/bin/python" --cwd "${DEPLOY_DIR}" \
              || true
            pm2 save

            # Record this commit so the next deploy can do the dep-skip math
            git rev-parse HEAD > "${LAST_DEPLOY_FILE}"
