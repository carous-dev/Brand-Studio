# ----- HTTP: Redirect all to HTTPS -----
<VirtualHost *:80>
    ServerName {{DOMAIN}}
    ServerAlias www.{{DOMAIN}}

    # Redirect all traffic to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ----- HTTPS: Serve Next.js -----
<VirtualHost *:443>
    ServerName {{DOMAIN}}
    ServerAlias www.{{DOMAIN}}

    # Use shared Cloudflare SSL certificate instead of per-domain Let’s Encrypt
    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/cloudflare-cert.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/cloudflare-key.pem
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLProtocol All -SSLv2 -SSLv3

    # Proxy Next.js
    ProxyPreserveHost On
    ProxyRequests Off
    <Proxy *>
        Require all granted
    </Proxy>
    ProxyPass / http://127.0.0.1:{{NEXT_PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{NEXT_PORT}}/

    # Handle WebSockets
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:{{WS_PORT}}/$1 [P,L]

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/{{DOMAIN_UNDERSCORE}}_error.log
    CustomLog ${APACHE_LOG_DIR}/{{DOMAIN_UNDERSCORE}}_access.log combined
</VirtualHost>
