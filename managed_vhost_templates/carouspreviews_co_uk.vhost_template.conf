# Managed base domain: carouspreviews.co.uk
# Generated by settings automation at 2026-02-13T00:52:13.745766Z

# ----- HTTP: Redirect all to HTTPS -----
<VirtualHost *:80>
    ServerName {{DOMAIN}}
    ServerAlias www.{{DOMAIN}}

    # Redirect all traffic to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ----- HTTPS: Serve Next.js -----
<VirtualHost *:443>
    ServerName {{DOMAIN}}
    ServerAlias www.{{DOMAIN}}

    # Use per-origin Cloudflare SSL certificate files
    SSLEngine on
    SSLCertificateFile {{SSL_CERT_FILE}}
    SSLCertificateKeyFile {{SSL_CERT_KEY_FILE}}
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLProtocol All -SSLv2 -SSLv3

    # Proxy Next.js
    ProxyPreserveHost On
    ProxyRequests Off
    <Proxy *>
        Require all granted
    </Proxy>
    ProxyPass / http://127.0.0.1:{{NEXT_PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{NEXT_PORT}}/

    # Handle WebSockets
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:{{WS_PORT}}/$1 [P,L]

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/{{DOMAIN_UNDERSCORE}}_error.log
    CustomLog ${APACHE_LOG_DIR}/{{DOMAIN_UNDERSCORE}}_access.log combined
</VirtualHost>
