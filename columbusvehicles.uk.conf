# ----- HTTP: Redirect all to HTTPS -----
<VirtualHost *:80>
    ServerName columbusvehicles.uk
    ServerAlias www.columbusvehicles.uk

    # Redirect all traffic to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ----- HTTPS: Serve Next.js -----
<VirtualHost *:443>
    ServerName columbusvehicles.uk
    ServerAlias www.columbusvehicles.uk

    # SSL certificates
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/columbusvehicles.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/columbusvehicles.uk/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Proxy Next.js
    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:4703/
    ProxyPassReverse / http://127.0.0.1:4703/

    # Handle WebSockets
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:4001/$1 [P,L]

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/columbusvehicles_error.log
    CustomLog ${APACHE_LOG_DIR}/columbusvehicles_access.log combined
</VirtualHost>
