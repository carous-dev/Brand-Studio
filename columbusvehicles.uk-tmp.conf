# Temporary HTTP-only vhost — exists ONLY so certbot --apache can issue the
# initial Let's Encrypt cert. After cert lands, disable + remove this file
# and enable columbusvehicles.uk.conf (the unified HTTP→HTTPS vhost).
<VirtualHost *:80>
    ServerName columbusvehicles.uk
    ServerAlias www.columbusvehicles.uk
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/columbusvehicles_tmp_error.log
    CustomLog ${APACHE_LOG_DIR}/columbusvehicles_tmp_access.log combined
</VirtualHost>
