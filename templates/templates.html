{% extends "base.html" %}

{% block title %}Templates - {{ super() }}{% endblock %}

{% block content %}
<section class="templates-section">
    <div class="filter-bar">
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All Templates</button>
            <button class="filter-tab" data-filter="homepage">Homepage</button>
            <button class="filter-tab" data-filter="inventory">Inventory</button>
            <button class="filter-tab" data-filter="modern">Modern</button>
            <button class="filter-tab" data-filter="classic">Classic</button>
        </div>
        <select class="filter-select">
            <option>Sort by: Featured</option>
            <option>Sort by: Newest</option>
            <option>Sort by: Popular</option>
        </select>
    </div>

    <div class="templates-grid">
        <!-- Template 1 -->
        <div class="template-card" data-category="homepage modern">
            <div class="template-preview">
                <div class="preview-screenshot">
                    <div class="skeleton-preview"></div>
                </div>
            </div>
            <div class="template-info">
                <h3>Modern Dealership Pro</h3>
            </div>
        </div>

        <!-- Template 2 -->
        <div class="template-card" data-category="inventory classic">
            <div class="template-preview">
                <div class="preview-screenshot">
                    <div class="skeleton-preview"></div>
                </div>
            </div>
            <div class="template-info">
                <h3>Classic Auto Gallery</h3>
            </div>
        </div>

        <!-- Template 3 -->
        <div class="template-card" data-category="homepage modern">
            <div class="template-preview">
                <div class="preview-screenshot">
                    <div class="skeleton-preview"></div>
                </div>
            </div>
            <div class="template-info">
                <h3>Luxury Motors</h3>
            </div>
        </div>

        <!-- Template 4 -->
        <div class="template-card" data-category="inventory modern">
            <div class="template-preview">
                <div class="preview-screenshot">
                    <div class="skeleton-preview"></div>
                </div>
            </div>
            <div class="template-info">
                <h3>Smart Inventory</h3>
            </div>
        </div>

        <!-- Template 5 -->
        <div class="template-card" data-category="listing modern">
            <div class="template-preview">
                <div class="preview-screenshot">
                    <div class="skeleton-preview"></div>
                </div>
            </div>
            <div class="template-info">
                <h3>Quick Listing Pro</h3>
            </div>
        </div>

        <!-- Template 6 -->
        <div class="template-card" data-category="homepage classic">
            <div class="template-preview">
                <div class="preview-screenshot">
                    <div class="skeleton-preview"></div>
                </div>
            </div>
            <div class="template-info">
                <h3>Family Motors</h3>
            </div>
        </div>
    </div>

    <div class="templates-pagination">
        <button class="pagination-btn" disabled>Previous</button>
        <div class="pagination-numbers">
            <button class="pagination-number active">1</button>
            <button class="pagination-number">2</button>
            <button class="pagination-number">3</button>
            <span>...</span>
            <button class="pagination-number">12</button>
        </div>
        <button class="pagination-btn">Next</button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Filter functionality
    const filterTabs = document.querySelectorAll('.filter-tab');
    const templateCards = document.querySelectorAll('.template-card');
    
    filterTabs.forEach(tab => {
        tab.addEventListener('click', function() {
            filterTabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            
            const filter = this.dataset.filter;
            templateCards.forEach(card => {
                if (filter === 'all' || card.dataset.category.includes(filter)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    });
});
</script>

<style>
/* Modern Dark Design System */
:root {
    /* Dark Theme Colors */
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --bg-card: #1e293b;
    --bg-hover: #334155;
    --bg-active: #475569;
    
    /* Text Colors */
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --text-inverse: #0f172a;
    
    /* Accent Colors */
    --primary-color: #3b82f6;
    --primary-hover: #2563eb;
    --primary-light: #60a5fa;
    --secondary-color: #64748b;
    --success-color: #10b981;
    --warning-color: #f59e0b;
    --danger-color: #ef4444;
    
    /* Border & UI */
    --border-color: #334155;
    --border-light: #475569;
    --divider-color: #475569;
    
    /* Shadows */
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0);
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0);
    --shadow-glow: 0 0 20px rgb(59 130 246 / 0);
    
    /* Radius & Spacing */
    --radius-sm: 0.375rem;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --radius-xl: 1rem;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Base Dark Theme */
.templates-section {
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
    background: var(--bg-primary);
    min-height: 100vh;
    color: var(--text-primary);
}

/* Header Styles */

.search-box {
    position: relative;
    flex: 1;
    max-width: 400px;
}

.search-input {
    width: 100%;
    padding: 0.875rem 1rem 0.875rem 3rem;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-lg);
    font-size: 0.95rem;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
}

.search-input::placeholder {
    color: var(--text-muted);
}

.search-input:focus {
    outline: none;
    border-color: var(--primary-color);
    background: var(--bg-hover);
    box-shadow: 0 0 0 3px rgb(59 130 246 / 0.2), var(--shadow-glow);
}

.search-box svg {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
}

/* Button Styles */
.btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: var(--radius-lg);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
}

.btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: left 0.5s;
}

.btn:hover::before {
    left: 100%;
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
    color: white;
    box-shadow: var(--shadow-md), 0 0 20px rgb(59 130 246 / 0.3);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-xl), var(--shadow-glow);
}

.btn-outline {
    background: transparent;
    color: var(--primary-color);
    border: 2px solid var(--primary-color);
}

.btn-outline:hover {
    background: var(--primary-color);
    color: white;
    transform: translateY(-2px);
    box-shadow: var(--shadow-glow);
}

.btn-sm {
    padding: 0.625rem 1.25rem;
    font-size: 0.875rem;
}

.btn-success {
    background: linear-gradient(135deg, var(--success-color), #059669);
    color: white;
    box-shadow: var(--shadow-md), 0 0 20px rgb(16 185 129 / 0.3);
}

/* Filter Bar Styles */
.filter-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    padding: 1.5rem;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 1rem;
}

.filter-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.filter-tab {
    padding: 0.625rem 1.25rem;
    border: 2px solid var(--border-color);
    background: var(--bg-tertiary);
    border-radius: 2rem;
    cursor: pointer;
    transition: var(--transition);
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-secondary);
}

.filter-tab:hover {
    background: var(--bg-hover);
    border-color: var(--primary-color);
    color: var(--primary-light);
    transform: translateY(-1px);
}

.filter-tab.active {
    background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
    color: white;
    border-color: var(--primary-color);
}

.filter-select {
    padding: 0.625rem 1rem;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-lg);
    font-size: 0.9rem;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    cursor: pointer;
    transition: var(--transition);
}

.filter-select:focus {
    outline: none;
    border-color: var(--primary-color);
}

.filter-select option {
    background: var(--bg-tertiary);
    color: var(--text-primary);
}

/* Template Grid Styles */
.templates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 2rem;
    margin-bottom: 3rem;
}

.template-card {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-xl);
    overflow: hidden;
    background: var(--bg-card);
    transition: var(--transition);
    position: relative;
}

.template-card:hover {
    transform: translateY(-8px);
    border-color: var(--primary-color);
}

.template-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-color), #8b5cf6, #ec4899);
    opacity: 0;
    transition: var(--transition);
}

.template-card:hover::before {
    opacity: 1;
}

/* Template Preview Styles */
.template-preview {
    position: relative;
    height: 200px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-hover));
}

.preview-screenshot {
    width: 100%;
    height: 100%;
    position: relative;
}

.skeleton-preview {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--bg-hover) 25%, var(--bg-active) 50%, var(--bg-hover) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    position: relative;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* Template Info Styles */
.template-info {
    padding: 1.5rem;
    background: var(--bg-card);
    text-align: center;
}

.template-info h3 {
    margin: 0;
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
}

/* Pagination Styles */
.templates-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-top: 3rem;
    padding: 2rem;
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-color);
}

.pagination-btn {
    padding: 0.75rem 1.5rem;
    border: 2px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: var(--transition);
    font-weight: 600;
}

.pagination-btn:hover:not(:disabled) {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    transform: translateY(-2px);
}

.pagination-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.pagination-numbers {
    display: flex;
    gap: 0.5rem;
}

.pagination-number {
    width: 48px;
    height: 48px;
    border: 2px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: var(--radius-lg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    transition: var(--transition);
}

.pagination-number:hover {
    background: var(--bg-hover);
    border-color: var(--primary-color);
    color: var(--primary-light);
    transform: translateY(-2px);
}

.pagination-number.active {
    background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
    color: white;
    border-color: var(--primary-color);
}

/* Responsive Design */
@media (max-width: 768px) {
    .templates-section {
        padding: 1rem;
    }
    
    .templates-header {
        flex-direction: column;
        align-items: stretch;
        padding: 1.5rem;
    }
    
    .header-content h1 {
        font-size: 2rem;
    }
    
    .header-actions {
        flex-direction: column;
    }
    
    .search-box {
        max-width: none;
    }
    
    .filter-bar {
        flex-direction: column;
        align-items: stretch;
    }
    
    .templates-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }
    
    .template-info {
        padding: 1.5rem;
    }
    
    .template-meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
    }
}

/* Loading States */
.btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none !important;
}

/* Success Animation */
@keyframes successPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.btn-success {
    animation: successPulse 0.5s ease-in-out;
}

/* Scrollbar Styling */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: var(--bg-secondary);
}

::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--primary-color);
}
</style>
{% endblock %}
