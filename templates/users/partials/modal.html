<!-- User Edit Modal -->
<div id="roleModal" class="modal" style="display: none;">
    <div class="modal-backdrop" onclick="closeRoleModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit User</h3>
            <button class="modal-close" onclick="closeRoleModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group">
                    <label for="modalUsername">Name *</label>
                    <input type="text" id="modalUsername" class="form-input" placeholder="Enter user name" required>
                </div>
                <div class="form-group">
                    <label for="modalEmail">Email *</label>
                    <input type="email" id="modalEmail" class="form-input" placeholder="Enter email address" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="modalPassword">Password (leave blank to keep current)</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="modalPassword" class="form-input password-input" placeholder="Enter new password to change">
                        <button type="button" class="password-toggle" data-target="modalPassword" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="modalConfirmPassword">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="modalConfirmPassword" class="form-input password-input" placeholder="Confirm new password">
                        <button type="button" class="password-toggle" data-target="modalConfirmPassword" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="modalRole">Role *</label>
                    <select id="modalRole" class="form-select" required>
                        <option value="admin">Admin - Full system access</option>
                        <option value="manager">Manager - Manage users and content</option>
                        <option value="editor">Editor - Create and edit content</option>
                        <option value="viewer">Viewer - Read-only access</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalStatus">Account Status</label>
                    <select id="modalStatus" class="form-select">
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeRoleModal()">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="saveUserRole()">Save Changes</button>
        </div>
    </div>
</div>

<!-- Add User Modal -->
<div id="addUserModal" class="modal" style="display: none;">
    <div class="modal-backdrop" onclick="UserManagement.closeAddUserModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add New User</h3>
            <button class="modal-close" onclick="UserManagement.closeAddUserModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="addUserName">Name *</label>
                <input type="text" id="addUserName" class="form-input" placeholder="Enter user name" required>
            </div>
            <div class="form-group">
                <label for="addUserEmail">Email *</label>
                <input type="email" id="addUserEmail" class="form-input" placeholder="Enter email address" required>
            </div>
            <div class="form-group">
                <label for="addUserPassword">Password *</label>
                <div class="password-input-wrapper">
                    <input type="password" id="addUserPassword" class="form-input password-input" placeholder="Enter password" required>
                    <button type="button" class="password-toggle" data-target="addUserPassword" aria-label="Toggle password visibility">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="addUserRole">Role *</label>
                <select id="addUserRole" class="form-select" required>
                    <option value="">Select a role</option>
                    <option value="viewer">Viewer - Read-only access</option>
                    <option value="editor">Editor - Create and edit content</option>
                    <option value="manager">Manager - Manage users and content</option>
                    <option value="admin">Admin - Full system access</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="UserManagement.closeAddUserModal()">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="UserManagement.addUser()">Add User</button>
        </div>
    </div>
</div>
